<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケット四柱推命</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f2f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#383141}button,input,select{font:inherit}.app{max-width:540px;min-height:100vh;margin:auto;background:#faf9fb}.header{display:flex;align-items:center;gap:8px;padding:14px;background:linear-gradient(115deg,#cbb5e5,#b9dfc1)}.title{flex:1;font-size:1.25rem;font-weight:700}.btn{border:0;border-radius:10px;padding:10px 13px;background:#725893;color:#fff}.save{background:#608f69}.form{padding:18px;display:grid;gap:14px}.field{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:8px}.input{width:100%;padding:12px 8px;border:1px solid #cdbdd7;border-radius:11px;background:#fff}.date{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:5px}.sex{display:flex;gap:20px}.menu-title{padding:15px 18px;background:linear-gradient(90deg,#ddcbef,#cbeacd);font-weight:700}.menu{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.menu button{min-height:64px;border:1px solid #76ae77;border-radius:14px;background:linear-gradient(145deg,#def2d7,#a8d6a6);color:#304337;font-size:1.06rem}.hide{display:none}.page{padding:14px 8px 28px}.profile{display:flex;gap:14px;padding:10px 12px;border:1px solid #82b379;border-radius:9px;background:linear-gradient(#d5edce,#b9dcae)}.grid{display:grid;grid-template-columns:98px repeat(3,minmax(0,1fr));gap:5px;margin-top:12px}.panel{border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0}.heading{min-height:43px;padding:5px;border:1px solid #cbc4d0;background:linear-gradient(145deg,#ebe7ef,#d4cedb);box-shadow:3px 4px 7px #514b572a;color:#332b39;font-size:.88rem;font-weight:600}.value{min-height:46px;padding:6px 3px;border:1px solid #d9dcae;background:linear-gradient(145deg,#fffef1,#f2f4d9);box-shadow:3px 4px 7px #514b5728;color:#302938}.heading,.value{cursor:pointer}.eto{min-height:106px;flex-direction:column;font-family:"Yu Mincho",serif;font-size:1.4rem}.eto small{width:100%;display:flex;justify-content:space-between;padding:0 4px;font-family:sans-serif;font-size:.67rem}.eto b{margin:7px 0 3px;font-weight:500}.eto em{font-size:1rem;font-style:normal}.double{min-height:106px;font-size:1.16rem}.empty{min-height:46px}.info{display:grid;grid-template-columns:98px 1fr;gap:5px;margin-top:14px}.wide{justify-content:flex-start;text-align:left;padding:9px 11px}.balance{display:grid;grid-template-columns:106px repeat(5,minmax(0,1fr));gap:4px;margin-top:14px}.balance>*{min-height:57px}.balance .value{flex-direction:column;font-size:.73rem}.balance b{font-size:1.05rem}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#261c2e70}.modal.open{display:flex}.dialog{width:min(100%,440px);max-height:82vh;overflow:auto;border-radius:16px;background:#fff}.dialog-head{position:sticky;top:0;display:flex;align-items:center;padding:13px 15px;background:linear-gradient(115deg,#cbb5e5,#b9dfc1)}.dialog-head h2{flex:1;margin:0;font-size:1.08rem}.close{border:0;border-radius:9px;padding:8px 13px;background:#725893;color:#fff}.dialog-body{padding:16px;line-height:1.7}.badge{display:inline-block;margin-bottom:9px;padding:5px 11px;border-radius:99px;background:#f1f2d9;font-weight:700}.item{padding:8px 0;border-bottom:1px solid #e4dfe7}.item b{display:block}@media(max-width:400px){.grid{grid-template-columns:92px repeat(3,minmax(0,1fr));gap:4px}.info{grid-template-columns:92px 1fr}.balance{grid-template-columns:100px repeat(5,minmax(0,1fr));gap:3px}}#detail .header{position:relative;justify-content:flex-start}#detail .header .title{position:absolute;left:50%;transform:translateX(-50%);width:max-content;text-align:center;letter-spacing:.5em;padding-left:.5em}.profile{justify-content:center;text-align:center;flex-wrap:wrap}.info .wide{justify-content:center;text-align:center}.energy-static{cursor:default}.balance{display:grid;grid-template-columns:106px minmax(0,1fr);gap:4px;margin-top:14px}.balance .heading{min-height:57px}.balance-bar{display:flex;min-height:57px;border-radius:8px;overflow:hidden;box-shadow:3px 4px 7px #514b5728;background:#ece9ee}.balance-segment{border:0;min-width:0;padding:0 3px;color:#fff;font-weight:700;text-shadow:0 1px 2px #0008;cursor:pointer;display:flex;align-items:center;justify-content:center}.balance-segment.wood{background:#459548}.balance-segment.fire{background:#d94a42}.balance-segment.earth{background:#8a5a36}.balance-segment.metal{background:#c5a018}.balance-segment.water{background:#3977bd}
/* Requested layout updates */
.profile{cursor:pointer}
.eto{min-height:82px}
.eto b{margin:7px 0 3px}
.balance{grid-template-columns:98px minmax(0,1fr)}
.balance-segment.wood{background:rgba(69,149,72,.60)}
.balance-segment.fire{background:rgba(217,74,66,.60)}
.balance-segment.earth{background:rgba(138,90,54,.60)}

/* V4: ユーザー指定のゴシック体を全ページ・全要素へ固定 */
:root{--app-gothic:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif}
html,body,body *,button,input,select,textarea,option{font-family:var(--app-gothic)!important}

/* V7: 鑑定メニューをカジュアルエレガントに */
.menu{
  padding:22px 18px 30px;
  gap:14px;
  background:linear-gradient(180deg,#fbfafc 0%,#f6f3f8 100%);
}
.menu button{
  position:relative;
  min-height:68px;
  overflow:hidden;
  border:1px solid rgba(150,125,87,.48);
  border-radius:16px;
  background:linear-gradient(145deg,#fffdf8 0%,#f4eee3 58%,#e9dfcd 100%);
  color:#493f4d;
  font-size:1.04rem;
  font-weight:600;
  letter-spacing:.08em;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
  box-shadow:0 5px 14px rgba(70,54,78,.13),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(143,112,71,.12);
  transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
}
.menu button::before{
  content:"";
  position:absolute;
  left:18%;right:18%;top:0;
  height:2px;
  background:linear-gradient(90deg,transparent,#c9a96e,transparent);
  opacity:.85;
}
.menu button::after{
  content:"◆";
  position:absolute;
  right:12px;bottom:8px;
  color:#b99b68;
  font-size:.48rem;
  opacity:.65;
}
.menu button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(70,54,78,.17),inset 0 1px 0 #fff;
  filter:brightness(1.015);
}
.menu button:active{
  transform:translateY(1px);
  box-shadow:0 2px 7px rgba(70,54,78,.14),inset 0 2px 5px rgba(116,88,55,.10);
}
.menu button:focus-visible{
  outline:3px solid rgba(114,88,147,.28);
  outline-offset:3px;
}

/* V8: 五行バランスをさらに淡いパステル調へ */
.balance-bar{background:rgba(245,243,247,.72)}
.balance-segment{color:#514a55;text-shadow:0 1px 0 rgba(255,255,255,.9);font-weight:700}
.balance-segment.wood{background:rgba(158,211,166,.46)}
.balance-segment.fire{background:rgba(244,166,159,.46)}
.balance-segment.earth{background:rgba(202,170,143,.46)}
.balance-segment.metal{background:rgba(235,211,124,.46)}
.balance-segment.water{background:rgba(148,190,229,.46)}
.balance-segment:hover{filter:brightness(1.03)}

/* V9: 命式レイアウト更新 */
.grid .heading.double{font-size:.88rem}
.balance{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:14px}
.balance .heading,.balance .gogyo-panel{min-height:57px}
.gogyo-panel{border:1px solid rgba(145,132,151,.20);border-radius:8px;color:#514a55;font-weight:700;cursor:pointer;box-shadow:2px 3px 7px rgba(81,75,87,.14),inset 0 1px 0 rgba(255,255,255,.75)}
.gogyo-panel.wood{background:rgba(158,211,166,.38)}
.gogyo-panel.fire{background:rgba(244,166,159,.38)}
.gogyo-panel.earth{background:rgba(202,170,143,.38)}
.gogyo-panel.metal{background:rgba(235,211,124,.38)}
.gogyo-panel.water{background:rgba(148,190,229,.38)}
.gogyo-panel:active{filter:brightness(.96)}
@media(max-width:400px){.balance{grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.balance .heading,.balance .gogyo-panel{font-size:.76rem}}
</style></head><body><main class="app"><section id="home"><header class="header"><div class="title">🌿 ポケット四柱推命</div><button class="btn" id="open">開く</button><button class="btn save" id="save">保存</button><input id="file" type="file" accept=".json" hidden></header><div class="form"><div class="field"><label>名前</label><input class="input" id="name" value="推命太郎"></div><div class="field"><span>生年月日</span><div class="date"><select class="input" id="yy"></select><select class="input" id="mm"></select><select class="input" id="dd"></select></div></div><div class="field"><span>性別</span><div class="sex"><label><input type="radio" name="sex" value="男性" checked>男性</label><label><input type="radio" name="sex" value="女性">女性</label></div></div></div><div class="menu-title">🔮 鑑定メニュー</div><nav class="menu"><button data-page="命式">命式</button><button>大運</button><button>年の運気</button><button>月の運気</button><button>相性</button><button>カレンダー</button></nav></section><section id="detail" class="hide"><header class="header"><button class="btn" id="back">戻る</button><div class="title">命　式</div></header><div id="body"></div></section></main><div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="mt"></h2><button class="close" id="close">閉じる</button></div><div class="dialog-body"><div class="badge" id="mv"></div><div id="mx"></div></div></div></div><script>const ETO_EXPLAIN={"甲子":{"reading":"きのえね","text":"甲子は「新しい流れを生み、成長を始める力」のイメージです。また六十干支の最初でもあります。\n甲は大きな木のように、成長力、まっすぐ進む姿勢、自立心を表し、子は冬や物事の始まりと結びつき、知性、直感、内側で力を蓄える性質を表します。"},"乙丑":{"reading":"きのとうし","text":"乙丑は「柔軟さを保ちながら、粘り強く基盤を築く力」のイメージです。\n乙は草花のように、柔軟さ、環境に合わせる力、周囲との協調を表し、丑は冬の終わりと結びつき、忍耐力、堅実さ、時間をかけて力を蓄える性質を表します。"},"丙寅":{"reading":"ひのえとら","text":"丙寅は「情熱を前面に出し、先頭に立って道を切り開く力」のイメージです。\n丙は太陽のように、明るさ、情熱、行動力、自分を表現する力を表し、寅は春の始まりと結びつき、行動力、新しいことを始める力、道を切り開く姿勢を表します。"},"丁卯":{"reading":"ひのとう","text":"丁卯は「繊細な感性を生かし、穏やかに可能性を広げる力」のイメージです。\n丁は小さな灯りのように、繊細さ、観察力、内に秘めた情熱を表し、卯は春の成長と結びつき、穏やかさ、柔軟性、人との調和を大切にする性質を表します。"},"戊辰":{"reading":"つちのえたつ","text":"戊辰は「安定した基盤から、大きな変化と理想を形にする力」のイメージです。\n戊は山のように、安定感、包容力、物事を支えて守る力を表し、辰は春から夏への移り変わりと結びつき、大きな理想、変化を起こす力、発展性を表します。"},"己巳":{"reading":"つちのとみ","text":"己巳は「物事を丁寧に育て、深い洞察によって整える力」のイメージです。\n己は田畑の土のように、人や物事を育てる力、調整力、細やかさを表し、巳は初夏と結びつき、探究心、集中力、表には出しすぎない情熱を表します。"},"庚午":{"reading":"かのえうま","text":"庚午は「強い決断力で活発に行動し、局面を切り開く力」のイメージです。\n庚は鋼のように、強い意志、決断力、状況を変える力、実行力を表し、午は夏の盛りと結びつき、活発さ、社交性、決断の速さ、強い行動力を表します。"},"辛未":{"reading":"かのとひつじ","text":"辛未は「繊細な美意識と内なる強さで、調和をつくる力」のイメージです。\n辛は磨かれた宝石のように、洗練された感覚、美意識、細部へのこだわりを表し、未は夏の終わりと結びつき、思いやり、成熟、周囲を整える力を表します。"},"壬申":{"reading":"みずのえさる","text":"壬申は「知恵と機転を広く巡らせ、環境に適応する力」のイメージです。\n壬は大きな川や海のように、自由な発想、知恵、広い視野、行動範囲の広さを表し、申は秋の始まりと結びつき、頭の回転の速さ、器用さ、環境に対応する力を表します。"},"癸酉":{"reading":"みずのととり","text":"癸酉は「静かな知性で細部を整え、成果を完成させる力」のイメージです。\n癸は雨や露のように、静かな知性、物事に深く浸透する力、忍耐力を表し、酉は秋の収穫と結びつき、分析力、正確さ、物事を完成させる力を表します。"},"甲戌":{"reading":"きのえいぬ","text":"甲戌は「まっすぐな信念で人や物事を守り、責任を果たす力」のイメージです。\n甲は大きな木のように、成長力、まっすぐ進む姿勢、自立心を表し、戌は秋の終わりと結びつき、誠実さ、責任感、大切なものを守る姿勢を表します。"},"乙亥":{"reading":"きのとい","text":"乙亥は「しなやかな感性で流れを捉え、独自の道を育てる力」のイメージです。\n乙は草花のように、柔軟さ、環境に合わせる力、周囲との協調を表し、亥は冬の始まりと結びつき、強い信念、内面の深さ、決めたことを進める力を表します。"},"丙子":{"reading":"ひのえね","text":"丙子は「明るい情熱と知性で、人を動かし新しい流れをつくる力」のイメージです。\n丙は太陽のように、明るさ、情熱、行動力、自分を表現する力を表し、子は冬や物事の始まりと結びつき、知性、直感、内側で力を蓄える性質を表します。"},"丁丑":{"reading":"ひのとうし","text":"丁丑は「内に情熱を蓄え、忍耐強く着実に前進する力」のイメージです。\n丁は小さな灯りのように、繊細さ、観察力、内に秘めた情熱を表し、丑は冬の終わりと結びつき、忍耐力、堅実さ、時間をかけて力を蓄える性質を表します。"},"戊寅":{"reading":"つちのえとら","text":"戊寅は「揺るがない意志で先頭に立ち、大きな目標へ進む力」のイメージです。\n戊は山のように、安定感、包容力、物事を支えて守る力を表し、寅は春の始まりと結びつき、行動力、新しいことを始める力、道を切り開く姿勢を表します。"},"己卯":{"reading":"つちのとう","text":"己卯は「穏やかな調整力で人を支え、環境を育てる力」のイメージです。\n己は田畑の土のように、人や物事を育てる力、調整力、細やかさを表し、卯は春の成長と結びつき、穏やかさ、柔軟性、人との調和を大切にする性質を表します。"},"庚辰":{"reading":"かのえたつ","text":"庚辰は「強い理想と決断力で、変化を現実の形にする力」のイメージです。\n庚は鋼のように、強い意志、決断力、状況を変える力、実行力を表し、辰は春から夏への移り変わりと結びつき、大きな理想、変化を起こす力、発展性を表します。"},"辛巳":{"reading":"かのとみ","text":"辛巳は「鋭い感性と集中力で、本質を見抜き変革する力」のイメージです。\n辛は磨かれた宝石のように、洗練された感覚、美意識、細部へのこだわりを表し、巳は初夏と結びつき、探究心、集中力、表には出しすぎない情熱を表します。"},"壬午":{"reading":"みずのえうま","text":"壬午は「自由な発想と行動力で、変化を素早く捉える力」のイメージです。\n壬は大きな川や海のように、自由な発想、知恵、広い視野、行動範囲の広さを表し、午は夏の盛りと結びつき、活発さ、社交性、決断の速さ、強い行動力を表します。"},"癸未":{"reading":"みずのとひつじ","text":"癸未は「柔らかな知恵と思いやりで、周囲を潤し整える力」のイメージです。\n癸は雨や露のように、静かな知性、物事に深く浸透する力、忍耐力を表し、未は夏の終わりと結びつき、思いやり、成熟、周囲を整える力を表します。"},"甲申":{"reading":"きのえさる","text":"甲申は「成長意欲と機転を組み合わせ、変化の中で道を開く力」のイメージです。\n甲は大きな木のように、成長力、まっすぐ進む姿勢、自立心を表し、申は秋の始まりと結びつき、頭の回転の速さ、器用さ、環境に対応する力を表します。"},"乙酉":{"reading":"きのととり","text":"乙酉は「柔軟な感性を磨き、完成度の高い形へ整える力」のイメージです。\n乙は草花のように、柔軟さ、環境に合わせる力、周囲との協調を表し、酉は秋の収穫と結びつき、分析力、正確さ、物事を完成させる力を表します。"},"丙戌":{"reading":"ひのえいぬ","text":"丙戌は「明るい正義感と責任感で、人や方針を守り抜く力」のイメージです。\n丙は太陽のように、明るさ、情熱、行動力、自分を表現する力を表し、戌は秋の終わりと結びつき、誠実さ、責任感、大切なものを守る姿勢を表します。"},"丁亥":{"reading":"ひのとい","text":"丁亥は「静かな情熱と深い感受性で、見えない可能性を捉える力」のイメージです。\n丁は小さな灯りのように、繊細さ、観察力、内に秘めた情熱を表し、亥は冬の始まりと結びつき、強い信念、内面の深さ、決めたことを進める力を表します。"},"戊子":{"reading":"つちのえね","text":"戊子は「確かな基盤に知恵を蓄え、将来を見据えて改革する力」のイメージです。\n戊は山のように、安定感、包容力、物事を支えて守る力を表し、子は冬や物事の始まりと結びつき、知性、直感、内側で力を蓄える性質を表します。"},"己丑":{"reading":"つちのとうし","text":"己丑は「地道な努力を積み重ね、安定した成果を育てる力」のイメージです。\n己は田畑の土のように、人や物事を育てる力、調整力、細やかさを表し、丑は冬の終わりと結びつき、忍耐力、堅実さ、時間をかけて力を蓄える性質を表します。"},"庚寅":{"reading":"かのえとら","text":"庚寅は「強い意志と行動力で、困難を突破し道を切り開く力」のイメージです。\n庚は鋼のように、強い意志、決断力、状況を変える力、実行力を表し、寅は春の始まりと結びつき、行動力、新しいことを始める力、道を切り開く姿勢を表します。"},"辛卯":{"reading":"かのとう","text":"辛卯は「繊細さと鋭さを両立させ、柔軟に質を高める力」のイメージです。\n辛は磨かれた宝石のように、洗練された感覚、美意識、細部へのこだわりを表し、卯は春の成長と結びつき、穏やかさ、柔軟性、人との調和を大切にする性質を表します。"},"壬辰":{"reading":"みずのえたつ","text":"壬辰は「大きな知恵と構想力で、変化を起こし人を導く力」のイメージです。\n壬は大きな川や海のように、自由な発想、知恵、広い視野、行動範囲の広さを表し、辰は春から夏への移り変わりと結びつき、大きな理想、変化を起こす力、発展性を表します。"},"癸巳":{"reading":"みずのとみ","text":"癸巳は「静かな洞察を深め、内側から情熱を動かす力」のイメージです。\n癸は雨や露のように、静かな知性、物事に深く浸透する力、忍耐力を表し、巳は初夏と結びつき、探究心、集中力、表には出しすぎない情熱を表します。"},"甲午":{"reading":"きのえうま","text":"甲午は「伸びやかな行動力で、自由に挑戦し可能性を広げる力」のイメージです。\n甲は大きな木のように、成長力、まっすぐ進む姿勢、自立心を表し、午は夏の盛りと結びつき、活発さ、社交性、決断の速さ、強い行動力を表します。"},"乙未":{"reading":"きのとひつじ","text":"乙未は「柔軟な発想と思いやりで、穏やかに成熟を促す力」のイメージです。\n乙は草花のように、柔軟さ、環境に合わせる力、周囲との協調を表し、未は夏の終わりと結びつき、思いやり、成熟、周囲を整える力を表します。"},"丙申":{"reading":"ひのえさる","text":"丙申は「明るさと機転を生かし、多方面で素早く成果を生む力」のイメージです。\n丙は太陽のように、明るさ、情熱、行動力、自分を表現する力を表し、申は秋の始まりと結びつき、頭の回転の速さ、器用さ、環境に対応する力を表します。"},"丁酉":{"reading":"ひのととり","text":"丁酉は「繊細な感性と集中力で、美しく精密に仕上げる力」のイメージです。\n丁は小さな灯りのように、繊細さ、観察力、内に秘めた情熱を表し、酉は秋の収穫と結びつき、分析力、正確さ、物事を完成させる力を表します。"},"戊戌":{"reading":"つちのえいぬ","text":"戊戌は「大きな安定感と誠実さで、信頼を守り抜く力」のイメージです。\n戊は山のように、安定感、包容力、物事を支えて守る力を表し、戌は秋の終わりと結びつき、誠実さ、責任感、大切なものを守る姿勢を表します。"},"己亥":{"reading":"つちのとい","text":"己亥は「人を育てる力と深い感受性で、独自の世界を築く力」のイメージです。\n己は田畑の土のように、人や物事を育てる力、調整力、細やかさを表し、亥は冬の始まりと結びつき、強い信念、内面の深さ、決めたことを進める力を表します。"},"庚子":{"reading":"かのえね","text":"庚子は「鋭い知性と決断力で、新しい仕組みを生み出す力」のイメージです。\n庚は鋼のように、強い意志、決断力、状況を変える力、実行力を表し、子は冬や物事の始まりと結びつき、知性、直感、内側で力を蓄える性質を表します。"},"辛丑":{"reading":"かのとうし","text":"辛丑は「内なる強さを蓄え、粘り強く理想を磨き上げる力」のイメージです。\n辛は磨かれた宝石のように、洗練された感覚、美意識、細部へのこだわりを表し、丑は冬の終わりと結びつき、忍耐力、堅実さ、時間をかけて力を蓄える性質を表します。"},"壬寅":{"reading":"みずのえとら","text":"壬寅は「大胆な行動と広い知恵で、未来への道を切り開く力」のイメージです。\n壬は大きな川や海のように、自由な発想、知恵、広い視野、行動範囲の広さを表し、寅は春の始まりと結びつき、行動力、新しいことを始める力、道を切り開く姿勢を表します。"},"癸卯":{"reading":"みずのとう","text":"癸卯は「静かな感性と柔軟性で、周囲に調和を広げる力」のイメージです。\n癸は雨や露のように、静かな知性、物事に深く浸透する力、忍耐力を表し、卯は春の成長と結びつき、穏やかさ、柔軟性、人との調和を大切にする性質を表します。"},"甲辰":{"reading":"きのえたつ","text":"甲辰は「高い理想をまっすぐ育て、大きな変化を起こす力」のイメージです。\n甲は大きな木のように、成長力、まっすぐ進む姿勢、自立心を表し、辰は春から夏への移り変わりと結びつき、大きな理想、変化を起こす力、発展性を表します。"},"乙巳":{"reading":"きのとみ","text":"乙巳は「柔らかな知性と探究心で、内側から可能性を伸ばす力」のイメージです。\n乙は草花のように、柔軟さ、環境に合わせる力、周囲との協調を表し、巳は初夏と結びつき、探究心、集中力、表には出しすぎない情熱を表します。"},"丙午":{"reading":"ひのえうま","text":"丙午は「強い情熱を全面に出し、周囲を巻き込み前進する力」のイメージです。\n丙は太陽のように、明るさ、情熱、行動力、自分を表現する力を表し、午は夏の盛りと結びつき、活発さ、社交性、決断の速さ、強い行動力を表します。"},"丁未":{"reading":"ひのとひつじ","text":"丁未は「温かな感性と成熟した調整力で、人を支える力」のイメージです。\n丁は小さな灯りのように、繊細さ、観察力、内に秘めた情熱を表し、未は夏の終わりと結びつき、思いやり、成熟、周囲を整える力を表します。"},"戊申":{"reading":"つちのえさる","text":"戊申は「安定した軸と機転を生かし、変化に即応する力」のイメージです。\n戊は山のように、安定感、包容力、物事を支えて守る力を表し、申は秋の始まりと結びつき、頭の回転の速さ、器用さ、環境に対応する力を表します。"},"己酉":{"reading":"つちのととり","text":"己酉は「細やかな育成力と分析力で、物事を完成へ導く力」のイメージです。\n己は田畑の土のように、人や物事を育てる力、調整力、細やかさを表し、酉は秋の収穫と結びつき、分析力、正確さ、物事を完成させる力を表します。"},"庚戌":{"reading":"かのえいぬ","text":"庚戌は「鋼の意志と責任感で、信念と仲間を守り抜く力」のイメージです。\n庚は鋼のように、強い意志、決断力、状況を変える力、実行力を表し、戌は秋の終わりと結びつき、誠実さ、責任感、大切なものを守る姿勢を表します。"},"辛亥":{"reading":"かのとい","text":"辛亥は「繊細な美意識と深い感受性で、独自性を磨く力」のイメージです。\n辛は磨かれた宝石のように、洗練された感覚、美意識、細部へのこだわりを表し、亥は冬の始まりと結びつき、強い信念、内面の深さ、決めたことを進める力を表します。"},"壬子":{"reading":"みずのえね","text":"壬子は「大きな知恵を内に蓄え、新たな始まりを生み出す力」のイメージです。\n壬は大きな川や海のように、自由な発想、知恵、広い視野、行動範囲の広さを表し、子は冬や物事の始まりと結びつき、知性、直感、内側で力を蓄える性質を表します。"},"癸丑":{"reading":"みずのとうし","text":"癸丑は「静かな知恵を粘り強く積み重ね、確かな基盤をつくる力」のイメージです。\n癸は雨や露のように、静かな知性、物事に深く浸透する力、忍耐力を表し、丑は冬の終わりと結びつき、忍耐力、堅実さ、時間をかけて力を蓄える性質を表します。"},"甲寅":{"reading":"きのえとら","text":"甲寅は「強い成長力と行動力で、自ら先頭に立ち道を開く力」のイメージです。\n甲は大きな木のように、成長力、まっすぐ進む姿勢、自立心を表し、寅は春の始まりと結びつき、行動力、新しいことを始める力、道を切り開く姿勢を表します。"},"乙卯":{"reading":"きのとう","text":"乙卯は「しなやかさと調和を重んじ、純粋な可能性を育てる力」のイメージです。\n乙は草花のように、柔軟さ、環境に合わせる力、周囲との協調を表し、卯は春の成長と結びつき、穏やかさ、柔軟性、人との調和を大切にする性質を表します。"},"丙辰":{"reading":"ひのえたつ","text":"丙辰は「明るい情熱と大きな構想を結び、理想を実現する力」のイメージです。\n丙は太陽のように、明るさ、情熱、行動力、自分を表現する力を表し、辰は春から夏への移り変わりと結びつき、大きな理想、変化を起こす力、発展性を表します。"},"丁巳":{"reading":"ひのとみ","text":"丁巳は「内なる情熱と探究心を深め、独自の価値を生む力」のイメージです。\n丁は小さな灯りのように、繊細さ、観察力、内に秘めた情熱を表し、巳は初夏と結びつき、探究心、集中力、表には出しすぎない情熱を表します。"},"戊午":{"reading":"つちのえうま","text":"戊午は「揺るがない安定感と活力で、決断を行動へ移す力」のイメージです。\n戊は山のように、安定感、包容力、物事を支えて守る力を表し、午は夏の盛りと結びつき、活発さ、社交性、決断の速さ、強い行動力を表します。"},"己未":{"reading":"つちのとひつじ","text":"己未は「人を育む力と思いやりで、成熟と調和を促す力」のイメージです。\n己は田畑の土のように、人や物事を育てる力、調整力、細やかさを表し、未は夏の終わりと結びつき、思いやり、成熟、周囲を整える力を表します。"},"庚申":{"reading":"かのえさる","text":"庚申は「鋭い決断と機転を組み合わせ、素早く革新する力」のイメージです。\n庚は鋼のように、強い意志、決断力、状況を変える力、実行力を表し、申は秋の始まりと結びつき、頭の回転の速さ、器用さ、環境に対応する力を表します。"},"辛酉":{"reading":"かのととり","text":"辛酉は「洗練された感性を極め、高い完成度を追求する力」のイメージです。\n辛は磨かれた宝石のように、洗練された感覚、美意識、細部へのこだわりを表し、酉は秋の収穫と結びつき、分析力、正確さ、物事を完成させる力を表します。"},"壬戌":{"reading":"みずのえいぬ","text":"壬戌は「広い知恵と誠実さで、人や価値を守り抜く力」のイメージです。\n壬は大きな川や海のように、自由な発想、知恵、広い視野、行動範囲の広さを表し、戌は秋の終わりと結びつき、誠実さ、責任感、大切なものを守る姿勢を表します。"},"癸亥":{"reading":"みずのとい","text":"癸亥は「深い感受性と内省によって、本質へ到達する力」のイメージです。\n癸は雨や露のように、静かな知性、物事に深く浸透する力、忍耐力を表し、亥は冬の始まりと結びつき、強い信念、内面の深さ、決めたことを進める力を表します。"} 。","生月中殺":"生月中殺とは、月柱が中殺され、仕事や家庭、社会生活に独自性が出る配置です。","生日中殺":"生日中殺とは、日柱が中殺され、自己認識や私生活に独特な感性が出る配置です。","日座中殺":"日座中殺とは、特定の干支により現実の枠に収まりにくい個性を示す配置です。","律音":"律音とは、命式内の二柱以上が同じ干支となり、その性質が強調される関係です。","宿命大半会":"宿命大半会とは、天干が同じで地支が三合関係となり、拡大性を読む組合せです。","三徳":"三徳とは、財星・官星・印星がそろい、知識を行動へ移して成果につなげる配置です。","五徳":"五徳とは、通変星の五分類がすべてそろい、幅広い才能を扱えるとされる配置です。"},ABNORMAL={"甲戌":{"reading":"きのえいぬ","text":"風のように動き回る自由人。 直感と行動力が抜群で変化のある環境ほど才能が伸びる一方、同じ場所に留まると気が滞りやすく結婚は距離感が重要になる。"},"乙亥":{"reading":"きのとい","text":"静かに未来を読む賢者。 時流を読む力が鋭く判断力も安定しているが、家庭内トラブルが起きやすく拠点を海外に置くなど環境の工夫が安定につながる。"},"戊戌":{"reading":"つちのえいぬ","text":"万能型のリアリスト。 頭脳明晰で実務に強く若いうちから経験を積むほど実力が磨かれるが、学歴が高いほど人付き合いが難しく結婚は慎重さが求められる。"},"庚子":{"reading":"かのえね","text":"数字に愛された知性派。 分析力が突出し仕事で成果を出しやすいが、男性は他人を格下扱いしがちで孤立に注意し、内臓を病みやすいため環境選びが大切になる。"},"辛亥":{"reading":"かのとい","text":"天真爛漫な芸術家。 感受性と表現力が豊かで独創性が光るが、傷が痕になりやすく身体のケアを怠ると大きなトラブルにつながるため日常的な注意が必要になる。"},"丁巳":{"reading":"ひのとみ","text":"頼られる大将タイプ。 感受性と実行力を兼ね備え独立にも向くが、親の仕事を継ぐと運が伸びにくく裕福な環境で育つと繊細さが過剰になりやすい。"},"辛巳":{"reading":"かのとみ","text":"静かに燃える芸能肌。 芸能や音楽で才能が光り未来を読む勘も鋭いが、女性は結婚後に親類とのトラブルが起きやすく相手を見下さない姿勢が安定の鍵になる。"},"壬午":{"reading":"みずのえうま","text":"素直で楽しい創造者。 行動力と創造力が高く霊的感受性も強いが、平和すぎる環境では刺激を求めて自らトラブルを起こしやすく外に健全な刺激が必要になる。"},"丙戌":{"reading":"ひのえいぬ","text":"人を笑顔にする芸人肌。 勘が鋭く占いにも向き場を明るくする力があるが、勉強に集中しすぎると人付き合いが難しくなり結婚トラブルを招きやすい。"},"丁亥":{"reading":"ひのとい","text":"霊感の強いヒーラー。 美しいものや真実を求める純度の高い感性を持つが、女性は異性との意思疎通が難しく誤解が生じやすいため感情整理が重要になる。"},"戊子":{"reading":"つちのえね","text":"自由奔放な個性派。 特技を活かして身を立て創造的な分野で力を発揮するが、一般家庭ではマナーが身につきにくく悪目立ちしやすいため規律ある環境が助けになる。"},"癸巳":{"reading":"みずのとみ","text":"発想がナナメ上のイベントメーカー。 人を楽しませる力が強く企画や起業で活躍するが、結婚に失敗すると離婚を繰り返しやすく距離感の調整が安定の鍵になる。"},"己亥":{"reading":"つちのとい","text":"静かなる策士。 危険察知と問題解決が得意で周囲を助ける存在になるが、平和な時ほど自ら問題を起こしがちで女性は結婚後に奔走し疲れを溜めやすい。"}};const $=s=>document.querySelector(s),Y=$('#yy'),M=$('#mm'),D=$('#dd'),KAN='甲乙丙丁戊己庚辛壬癸',SHI='子丑寅卯辰巳午未申酉戌亥';function add(e,a,b,s){for(let i=a;i<=b;i++)e.add(new Option(i+s,i))}add(Y,1930,2051,'年');add(M,1,12,'月');add(D,1,31,'日');Y.value=2001;M.value=1;D.value=1;function days suimei-data.json';a.click()};$('#open').onclick=()=>$('#file').click();const PILLAR={年柱:'年柱は、社会との関わりや祖先から受け継ぐ影響を示し、おおむね0歳から20歳頃までの初年運を表します。',月柱:'月柱は、仕事運や社会で発揮する才能を示し、おおむね20歳から40歳頃までの中年運を表します。',日柱:'日柱は、生まれ持った本質的な性格と、配偶者との関係や配偶者運を表します。'};const modal=$('#modal');document.addEventListener('click',e=>{let p=e.target.closest('[data-kind]');if(!p)return;let k=p.dataset.kind,v=p.dataset.value,out='';$('#mt').textContent=k==='見出し'?v:(k==='五行総合'?'五行バランス':k);const fullWidth=n=>String(n).replace(/[0-9]/g,d=>'０１２３４５６７８９'[d]);$('#mv').textContent=k==='十二運星'?`${v}　エネルギー:${fullWidth(p.dataset.energy)}`:v;$('#mv').style.display=(k==='見出し'||k==='干支'||k==='異常干支'||k==='守護神'||k==='五行総合')?'none':'inline-block';if(k==='五行総合')out='工事中';else if(k==='見出し'&&v==='守護神')return;else if(k==='見出し')out=EXPLAIN[v]||'解説を準備中です。';else if(k==='柱')out=PILLAR[v];else if(k==='異常干支'){let a=JSON.parse(p.dataset.ab);out=a.length?a.map(([pl,et])=>`<div class="item">${ABNORMAL[et].text}</div>`).join(''):'異常干支には該当しません。'}else if(EXPLAIN[v])out=EXPLAIN[v];else if(k==='守護神')out='相性をみる方の日柱にこの十干が含まれているかを読みます。';else if(k==='天中殺')out=EXPLAIN['天中殺'];else if(k==='干支'){const q=ETO_EXPLAIN[v];out=q?`<div class="item"><b>${v}（${q.reading}） 干支No${eno(v)}</b>${q.text}</div>`:`干支「${v}」の解説は登録されていません。`;}else if(k==='蔵干')out=`蔵干「${v}」は、表面に現れにくい資質や内面的な本質を示す十干です。`;else if(k==='運勢エネルギー')out=`運勢エネルギー「${v}」は、十二運星の外向きの勢いを数値化した参考値です。`;else if(k==='五行バランス'){const name=v.trim().charAt(0);out=GOGYO_EXPLAIN[name]||'五行の解説は登録されていません。';}else out=`「${v}」の解説を準備中です。`;$('#mx').innerHTML=out;modal.classList.add('open')});function close(){modal.classList.remove('open')}$('#close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};</script></body></html>
